spring:
  application:
    name: backend

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:postgresql://localhost:5432/avito
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  catalog:
    microcategories:
      101: Ремонт под ключ
      102: Штукатурные работы
      103: Плиточные работы
      104: Сантехника
      105: Электрика
      106: Поклейка обоев и малярные работы

jwt:
  secret: ${JWT_SECRET}
  issuer: avito-monolith
  access-token-ttl: 15m
  refresh-token-ttl: 7d

ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}
  connect-timeout: ${ML_CONNECT_TIMEOUT:3s}
  read-timeout: ${ML_READ_TIMEOUT:30s}
